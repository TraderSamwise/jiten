name: CI

on:
  push:
    branches: [master]
  pull_request:

# Skip husky git-hook installation in CI (the `prepare` script).
env:
  HUSKY: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # postinstall runs patch-package and builds the generated WebView bundles.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test
